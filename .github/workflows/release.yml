name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release asset
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version=${RELEASE_VERSION#v}
          sed "s/^VERSION=.*/VERSION=$version/" bin/set-pre-commit >set-pre-commit
          chmod +x set-pre-commit
          sha256sum set-pre-commit >set-pre-commit.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes set-pre-commit set-pre-commit.sha256
